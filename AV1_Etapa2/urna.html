<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica - Simulação 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-controle">
        <h1>Simulação da Urna Eletrônica</h1>
        <div class="controles">
            <button class="btn-tse" id="btnEncerrar" onclick="encerrarVotacaoEEnviarTSE()">
                Encerrar votação e gerar votos.json
            </button>
            <button class="btn-apuracao" onclick="mostrarApuracao()">
                Boletim de Urna
            </button>
        </div>
        <p id="statusSistema" class="status">Carregando candidaturas...</p>
    </header>

    <main class="urna">
        <section class="tela" id="tela">
            <div id="conteudo-voto">
                <div class="tela-topo">
                    <div>
                        <span>SEU VOTO PARA</span>
                        <div class="cargo-titulo" id="lblCargo">CARREGANDO...</div>
                    </div>
                    <img id="imgCandidato" class="foto-candidato" src="" alt="Foto do candidato">
                </div>

                <div class="quadrados-numero" id="containerDigitos"></div>

                <div class="dados-candidato" id="dadosCandidato"></div>

                <div class="tela-instrucoes" id="instrucoes">
                    Aperte a tecla:<br>
                    <strong>VERDE</strong> para CONFIRMAR<br>
                    <strong>LARANJA</strong> para CORRIGIR<br>
                    <strong>BRANCA</strong> para VOTO EM BRANCO
                </div>
            </div>
        </section>

        <section class="teclado" aria-label="Teclado da urna">
            <div class="teclado-topo">JUSTIÇA ELEITORAL</div>

            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('1')">1</button>
                <button class="btn-num" onclick="digitar('2')">2</button>
                <button class="btn-num" onclick="digitar('3')">3</button>
            </div>
            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('4')">4</button>
                <button class="btn-num" onclick="digitar('5')">5</button>
                <button class="btn-num" onclick="digitar('6')">6</button>
            </div>
            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('7')">7</button>
                <button class="btn-num" onclick="digitar('8')">8</button>
                <button class="btn-num" onclick="digitar('9')">9</button>
            </div>
            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('0')">0</button>
            </div>

            <div class="teclado-acoes">
                <button class="btn-acao btn-branco" onclick="votarBranco()">Branco</button>
                <button class="btn-acao btn-corrige" onclick="corrigir()">Corrige</button>
                <button class="btn-acao btn-confirma" onclick="confirmar()">Confirma</button>
            </div>
        </section>
    </main>

    <section id="apuracao" class="apuracao" hidden>
        <div class="apuracao-cabecalho">
            <h2>Boletim de Urna</h2>
            <button onclick="fecharApuracao()">Fechar</button>
        </div>
        <div id="resultadoApuracao"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
